[package]
name = "chip8_runtime"
version = "0.1.0"
edition = "2021"
default-run = "chip8_runtime"

[features]
default = []
fs_write = []  # Enable filesystem write operations (disabled by default for safety)

[dependencies]
minifb = "0.28.0"
chip8_core = { path = "chip8_core" }

# Benchmarking infrastructure (requires Rust 1.81+)
# Uncomment when Rust version is upgraded:
# [dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }
#
# [[bench]]
# name = "allocator"
# harness = false
#
# [[bench]]
# name = "syscalls"
# harness = false
#
# [[bench]]
# name = "opcodes"
# harness = false

[workspace]
members = [
    ".",
    "chip8_core",
]
